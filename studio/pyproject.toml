[project]
name = "studio"
version = "0.1.0"
description = "Studio v2 — plataforma de automação de vídeos YouTube (greenfield, Fase 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    # Fase 2 — biblioteca
    "lancedb>=0.15",
    "pyarrow>=17",
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.10",
    "pillow>=10",
    "numpy>=1.26",
    # torch 2.5.1+cu121: última linha com suporte Pascal (GTX 1050 Ti, sm_61)
    "torch==2.5.1",
    "transformers>=4.44,<5",
    "sentencepiece>=0.2",  # tokenizer do SigLIP
    "protobuf>=4.25",      # idem (conversão do tokenizer)
    # Fase 3 — áudio
    "faster-whisper>=1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[project.scripts]
studio = "studio.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
