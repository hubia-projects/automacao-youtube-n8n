services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-pipeline-app
    ports:
      - "${APP_HOST_PORT:-8081}:8080"
    env_file:
      - ../.env
    environment:
      - MULTIVOZES_BR_BASE_URL=http://multivozes:5050/v1
    volumes:
      - ./output:/app/pipeline/output
      - ./src:/app/src
      - ./tests:/app/tests
      - ./n8n:/app/n8n
    depends_on:
      multivozes:
        condition: service_healthy
    restart: unless-stopped

  multivozes:
    build:
      context: ../multivozes_br_engine
      dockerfile: Dockerfile
    container_name: yt-pipeline-multivozes
    env_file:
      - ../multivozes_br_engine/.env
    working_dir: /app
    command: python -m uvicorn main:app --host 0.0.0.0 --port 5050 --reload
    ports:
      - "5050:5050"
    volumes:
      - ../multivozes_br_engine:/app
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "speech.platform.bing.com:150.171.30.10"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/v1/models', timeout=5)"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: yt-pipeline-n8n
    ports:
      - "${N8N_HOST_PORT:-5679}:5678"
    env_file:
      - ../.env
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - WEBHOOK_URL=http://localhost:${N8N_HOST_PORT:-5679}
      - BACKEND_BASE_URL=http://app:8080
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows
    depends_on:
      - app
    restart: unless-stopped

volumes:
  n8n_data:
